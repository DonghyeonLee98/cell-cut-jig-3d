  function onLoaded(gltf) {

      if (!gid) { o.visible = false; return; }
      const g = GID[gid];
      const base = raw.replace(/__(s35|snap18)$/, '');
      const typeSuffix = (raw.match(/__(s35|snap18)$/) || [])[1] || null;
      let mat;

        mat = mkMat(g, { transparent: true, opacity: base === 'overhang' ? 0.95 : 0.3, depthWrite: base === 'overhang', metalness: 0.0, roughness: 0.3 });
        if (base === 'overhang') { mat.color = new THREE.Color('#e08a2e'); mat.clippingPlanes = [slabPlane]; slabMat = mat; }

  // ---------------------------------------------------------------- tween variables

  }
  function setNow(o) { Object.keys(o).forEach((k) => { V[k] = o[k]; delete tw[k]; }); }

    Object.keys(tw).forEach((k) => {

      let u = (now - a.t0) / a.dur;

      V[k] = a.from + (a.to - a.from) * u;
    });
  }

  function vis() {
    const step = mode === 'prac' ? stepIdx + 1 : 0;
    const seated = V.hp > 1.99;
    // blade-type specific parts

    const guardMesh = meshes['blade_guard_park__' + bladeType.toLowerCase()];

  function applyTargets(st, prevIdx, fromReplay) {
    const dir = prevIdx == null ? 1 : Math.sign(stepIdx - prevIdx);
    const dur = 900;
    Object.keys(st).forEach((k) => {
      if (k === 'hp' || k === 'hov' || k === 'flip' || k === 'car') return;

    if (st.hp !== V.hp || st.hov !== V.hov || st.flip !== V.flip) {
      if (st.hp > V.hp) { go('hp', st.hp, 1900, 300); go('hov', st.hov, 1100, 2300); go('flip', st.flip, 400, 0); }
      else if (st.hp < V.hp) { go('hov', 45, 800, 0); go('hp', st.hp, 1900, 800); go('flip', 0, 400, 0); }
      else { go('hov', st.hov, 900, 0); go('flip', st.flip, 400, 0); }
    }
    const slow = STEPS[stepIdx].slow;
    if (st.car !== V.car) go('car', st.car, slow && st.car > V.car ? 4200 : 1600, 0);
  }
  function goStep(i, replay) {
    const prev = stepIdx; stepIdx = Math.max(0, Math.min(STEPS.length - 1, i));
    wrongBlocked = false;
    const s = STEPS[stepIdx];
    if (replay) {
      const p = STEPS[Math.max(0, stepIdx - 1)].st; setNow(stepIdx === 0 ? D0 : p);
    }
    applyTargets(s.st, replay ? stepIdx - 1 : prev, replay);
    setHL(s.hl.concat(s.hl.includes('f0') ? [] : []));
    goCam(s.cam); updateStepUI();
    location.hash = 'practice&step=' + (stepIdx + 1);
  }

  function setMode(m, init) {
    mode = m;
    $('m-model').setAttribute('aria-pressed', String(m === 'model'));
    $('m-prac').setAttribute('aria-pressed', String(m === 'prac'));
    $('p-model').hidden = m !== 'model'; $('p-prac').hidden = m !== 'prac';
    wrongBlocked = false; $('warn').hidden = true;
    if (m === 'model') {
      Object.keys(tw).forEach((k) => delete tw[k]);
      setNow(Object.assign({}, D0, { hp: 2, hov: 0, guard: 1, car: modelCar === 'cut' ? 0 : X_PARK, fence: 1 }));
      if (modelCar === 'park') V.guard = 0;
      setHL([]); goCam('model'); if (!init) location.hash = '';
      $('b-car').textContent = t(modelCar === 'cut' ? 'car_cut' : 'car_park');
    } else {
      Object.keys(tw).forEach((k) => delete tw[k]);
      setNow(STEPS[0].st); stepIdx = 0; select(null);
      goStep(0, false);
    }
  }
  let modelCar = 'cut';

  // ---------------------------------------------------------------- language
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach((e) => { e.textContent = t(e.dataset.i); });
    $('lang').textContent = lang === 'ko' ? 'EN' : '한';
    $('hint').textContent = t('hint');
    $('s-prev').textContent = t('prev'); $('s-next').textContent = t('next'); $('s-replay').textContent = t('replay');
    $('x-wrong').textContent = t('x_wrong'); $('x-right').textContent = t('x_right');
    $('b-car').textContent = t(modelCar === 'cut' ? 'car_cut' : 'car_park'); $('b-spin').textContent = t('spin');
    $('blade_note').textContent = t('blade_' + bladeType);
    fillParts(); fillChecks(); updateStepUI();
    const tip = $('tip'); if (!tip.hidden && selected) select(selected);
  }

  // ---------------------------------------------------------------- events
  $('lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; applyLang(); });
  $('m-model').addEventListener('click', () => setMode('model'));
  $('m-prac').addEventListener('click', () => setMode('prac'));
  $('b-S35').addEventListener('click', () => { bladeType = 'S35'; applyBlade(); });
  $('b-SNAP18').addEventListener('click', () => { bladeType = 'SNAP18'; applyBlade(); });
  $('b-car').addEventListener('click', () => {
    modelCar = modelCar === 'cut' ? 'park' : 'cut'; go('car', modelCar === 'cut' ? 0 : X_PARK, 1500, 0); go('guard', modelCar === 'cut' ? 1 : 0, 800, 0);
    $('b-car').textContent = t(modelCar === 'cut' ? 'car_cut' : 'car_park');
  });
  $('b-spin').addEventListener('click', () => { const on = $('b-spin').getAttribute('aria-pressed') !== 'true'; $('b-spin').setAttribute('aria-pressed', String(on)); controls.autoRotate = on; controls.autoRotateSpeed = 1.2; $('b-spin').style.background = on ? 'var(--accent)' : ''; $('b-spin').style.color = on ? '#fff' : ''; });
  $('s-prev').addEventListener('click', () => goStep(stepIdx - 1));
  $('s-next').addEventListener('click', () => goStep(stepIdx + 1));
  $('s-replay').addEventListener('click', () => goStep(stepIdx, true));
  $('x-wrong').addEventListener('click', () => {
    wrongBlocked = false; $('warn').hidden = true;
    Object.keys(tw).forEach((k) => { if (k === 'hov' || k === 'flip') delete tw[k]; });
    go('hov', 45, 700, 0); go('flip', 1, 900, 700); go('hov', 24.5, 900, 1800);
    setTimeout(() => { wrongBlocked = true; updateStepUI(); }, 2750);
  });
  $('x-right').addEventListener('click', () => {
    wrongBlocked = false; updateStepUI();
    go('hov', 45, 700, 0); go('flip', 0, 900, 700); go('hov', 0, 1000, 1800);
  });

  // tap a part in the canvas
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const objs = Object.values(meshes).filter((m) => m.visible && m.userData.gid && m.userData.gid !== 'holder');
    const hit = ray.intersectObjects(objs, false)[0];
    if (hit) { if (mode === 'model') select(hit.object.userData.gid); else { select(hit.object.userData.gid); } } else select(null);
  });

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentElement);

  let running = false;
  function tick() {
    if (!running) running = true;
    const now = performance.now();
    stepTw(now);
    if (camTween) {
      const u = Math.min(1, (now - camTween.t0) / camTween.dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.q0, camTween.q1, e);
      if (u >= 1) camTween = null;
    }
    poseHolder(); vis(); applyHL(now);
    controls.update(); renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  // ---------------------------------------------------------------- start
  function b64ToBuf(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
  buildDots(); applyLang(); setCam('model');
  $('status').textContent = '…';
  window.__cut = { V, get step() { return stepIdx; }, get mode() { return mode; }, goStep, setMode, meshes, camera, controls, get wrong() { return wrongBlocked; } };
  new THREE.GLTFLoader().parse(b64ToBuf(window.CUT_GLB), '', function (g) {
    onLoaded(g);
    const h = location.hash;
    if (/practice/.test(h)) { setMode('prac'); const m = h.match(/step=(\d+)/); if (m) goStep(Math.max(0, Math.min(STEPS.length - 1, +m[1] - 1)));
      if (/wrong/.test(h)) $('x-wrong').click(); }
  }, function (err) { $('status').textContent = 'load error: ' + err; });
})();
</script>
